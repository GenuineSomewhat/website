<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style/home.css">
        <link rel="stylesheet" href="style/music.css">
        <link rel="icon" type="image/png" href="assets/favicon.png">
        <title>Genuine Somewhat</title>
    </head>

    <body>
        <!-- Main content area that gets replaced -->
        <main id="page-content">
            <h1>Genuine Somewhat</h1>
            <a href="#music">  
                <button class="button-48" role="button"><span class="text">Music</span></button>
            </a>
        </main>

        <!-- Persistent player (hidden when on home page) -->
        <div id="player-container" style="display: none;">
            <h1>Music</h1>
            <h3>I like to make music. I'd say it's definitely my passion.</h3>

            <section class="media-area">
                <div class="now-playing">
                    <p class="now-playing-label">Now playing</p>
                    <p id="now-playing-title" class="now-playing-title">Select a track</p>
                </div>

                <div class="player" id="main-player">
                    <button class="player-button" id="play-button" type="button">Play</button>
                    <input class="player-progress" id="player-progress" type="range" min="0" max="100" value="0" step="0.1">
                    <span class="player-time" id="player-time">0:00 / 0:00</span>
                </div>

                <audio id="player-audio" class="player-audio" preload="none"></audio>
            </section>

            <div id="track-list" class="track-list">
                <p>Loading tracks...</p>
            </div>

            <a href="#home">
                <button class="floating-button">back to home</button>
            </a>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/jsmediatags@3.9.7/dist/jsmediatags.min.js"></script>
        <script>
            // Page navigation
            const pageContent = document.getElementById('page-content');
            const playerContainer = document.getElementById('player-container');
            const playButton = document.getElementById('play-button');
            const playerAudio = document.getElementById('player-audio');
            const playerProgress = document.getElementById('player-progress');
            const playerTime = document.getElementById('player-time');
            const nowPlayingTitle = document.getElementById('now-playing-title');
            const trackList = document.getElementById('track-list');

            // Player state persistence
            const playerState = {
                currentTrack: localStorage.getItem('currentTrack') || null,
                isPlaying: localStorage.getItem('isPlaying') === 'true',
                currentTime: parseFloat(localStorage.getItem('currentTime')) || 0,
            };

            // Handle hash-based navigation
            window.addEventListener('hashchange', loadPage);
            window.addEventListener('load', loadPage);

            function loadPage() {
                const hash = window.location.hash.slice(1) || 'home';
                
                if (hash === 'home') {
                    pageContent.style.display = 'block';
                    playerContainer.style.display = 'none';
                } else if (hash === 'music') {
                    pageContent.style.display = 'none';
                    playerContainer.style.display = 'block';
                    loadTracks();
                    // Restore player state
                    if (playerState.currentTrack) {
                        playerAudio.src = playerState.currentTrack;
                        playerAudio.currentTime = playerState.currentTime;
                        if (playerState.isPlaying) {
                            playerAudio.play();
                            playButton.textContent = 'Pause';
                        }
                    }
                }
            }

            // Save player state before leaving
            window.addEventListener('beforeunload', () => {
                localStorage.setItem('currentTrack', playerAudio.src);
                localStorage.setItem('isPlaying', playerAudio.playing);
                localStorage.setItem('currentTime', playerAudio.currentTime);
            });

            // Update progress bar
            playerAudio.addEventListener('timeupdate', () => {
                const percent = (playerAudio.currentTime / playerAudio.duration) * 100;
                playerProgress.value = percent || 0;
                updateTimeDisplay();
            });

            // Seek on progress bar click
            playerProgress.addEventListener('change', () => {
                playerAudio.currentTime = (playerProgress.value / 100) * playerAudio.duration;
            });

            // Play/Pause button
            playButton.addEventListener('click', () => {
                if (playerAudio.paused) {
                    playerAudio.play();
                    playButton.textContent = 'Pause';
                } else {
                    playerAudio.pause();
                    playButton.textContent = 'Play';
                }
            });

            function updateTimeDisplay() {
                const current = formatTime(playerAudio.currentTime);
                const duration = formatTime(playerAudio.duration);
                playerTime.textContent = `${current} / ${duration}`;
            }

            function formatTime(seconds) {
                if (!seconds || isNaN(seconds)) return '0:00';
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            }

            // Load tracks from GitHub
            async function loadTracks() {
                const repoOwner = "GenuineSomewhat";
                const repoName = "Music-of-the-Paper-Realm";
                const apiUrl = `https://api.github.com/repos/${repoOwner}/${repoName}/contents`;

                try {
                    const response = await fetch(apiUrl);
                    const files = await response.json();
                    
                    const audioExtensions = ["mp3", "wav", "ogg", "m4a", "flac"];
                    const tracks = files.filter(file => 
                        audioExtensions.some(ext => file.name.toLowerCase().endsWith('.' + ext))
                    );

                    trackList.innerHTML = '';
                    tracks.forEach(track => {
                        const trackEl = document.createElement('div');
                        trackEl.className = 'track';
                        trackEl.innerHTML = `
                            <button class="track-play-button" data-url="${track.download_url}">▶</button>
                            <span class="track-name">${track.name.replace(/\.[^/.]+$/, '')}</span>
                            <a href="${track.download_url}" download class="track-download">⬇</a>
                        `;
                        
                        trackEl.querySelector('.track-play-button').addEventListener('click', () => {
                            playerAudio.src = track.download_url;
                            playerState.currentTrack = track.download_url;
                            playerAudio.play();
                            playButton.textContent = 'Pause';
                            nowPlayingTitle.textContent = track.name;
                        });
                        
                        trackList.appendChild(trackEl);
                    });
                } catch (error) {
                    trackList.innerHTML = '<p>Error loading tracks. Please try again.</p>';
                    console.error(error);
                }
            }

            // Initialize
            loadPage();
        </script>
    </body>
</html>
